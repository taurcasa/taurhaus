schema:
  kind: team_preset
  version: 1

preset_id: fullstack-dev-codex
name: Full Stack Dev Team (Codex Lead)
description: Codex orchestrator with two Codex implementation agents.
version: 1.0.0

lead_role_id: codex-orchestrator

agent_slots:
  - role_id: codex-developer
    count: 2
    project_binding: lead_project
    overrides:
      name_pattern: dev-{n}
      instructions_append: |
        Coordinate implementation work across backend and frontend lanes.
        Keep interfaces and integration points explicit in status updates.

defaults:
  team_name_pattern: "{project}-team"
  tmux_layout: tiled
