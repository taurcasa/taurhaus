schema:
  kind: team_preset
  version: 1

preset_id: taurhaus-standard
name: Taurhaus Standard Team
description: "Standard Taurhaus operating team with a Claude lead, one architect, and two developers. The designer role stays on-demand because the preset schema does not support optional slots; add taurhaus-designer when active design work exists."
version: 1.0.0

lead_role_id: taurhaus-lead-claude

agent_slots:
  - role_id: taurhaus-architect
    count: 1
    project_binding: lead_project
    overrides:
      name_pattern: architect
      instructions_append: |
        You are the single architecture owner for this team instance.
        Keep reviews, investigations, and structural guidance centralized so
        developers do not split architecture decisions across lanes.

  - role_id: taurhaus-developer
    count: 2
    project_binding: lead_project
    overrides:
      name_pattern: developer{n}
      instructions_append: |
        This standard team expects two implementation lanes.
        Coordinate with the architect on structural questions, keep validation
        concrete, and use the ownership override rule only for narrow
        validation unblockers.

defaults:
  team_name_pattern: "{project}-team"
  tmux_layout: tiled
