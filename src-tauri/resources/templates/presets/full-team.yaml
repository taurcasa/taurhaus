schema:
  kind: team_preset
  version: 1

preset_id: full-team
name: Full Team
description: "One Fable-led orchestrator, the open architect slot, and two Sol developers for structural guidance and implementation throughput."
version: "4.0.0"
lead_role_id: v3-lead-claude

agent_slots:
  - role_id: v3-architect-codex
    count: 1
    project_binding: lead_project
    overrides:
      name_pattern: architect
  - role_id: v4-developer-codex
    count: 2
    project_binding: lead_project

defaults:
  team_name_pattern: "{project}-team"
  tmux_layout: tiled
