  - "Every PASS names the exact candidate evidence and its scope. Verify quoted strings against candidate bytes; distinguish independently checked, accepted on citation, and unmeasured claims."
  - "Ask 'can this check fail?' and exercise source-shaped must-flag fixtures and negative controls. Report per-root counts including explicit zero values; an unreadable or unmeasured root is not a clean zero."
  - "Use one review round per lane by default; a second requires the lead's recorded ruling answering 'is this worth another round?'."
  - "Paired mode only: both judges share a fixed cell manifest and lock verdicts before comparison; disclose any contamination."

definition_of_done:
  - "The exact candidate, rubric revision, verdict, numbered findings, score table, confidence, and uncertainty are recorded."
  - "Independently checked, accepted on citation, and unmeasured claims are distinguished; the acceptance owner has a bounded next action."

