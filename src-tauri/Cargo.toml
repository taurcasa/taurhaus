[package]
name = "taurhaus"
version = "0.1.0"
description = "Desktop tool for AI project management"
authors = ["Matthias Stier <stierms@gmail.com>"]
edition = "2021"
publish = false
default-run = "taurhaus"

[lib]
name = "taurhaus_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "taurhaus-daemon"
path = "src/bin/taurhaus-daemon.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rusqlite = { version = "0.32", features = ["bundled"] }

git2 = "0.19"
ignore = "0.4"

serde_yaml = "0.9"

notify = "7"
notify-debouncer-full = "0.4"

tantivy = "0.22"
toml = "1.0.2"
dirs = "6.0.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ctrlc = "3"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
