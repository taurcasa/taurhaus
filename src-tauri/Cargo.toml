[package]
name = "taurhaus"
version = "0.5.9"
description = "Desktop tool for AI project management"
authors = ["Matthias Stier <dev@taurcasa.dev>"]
edition = "2021"
license = "MIT"
publish = false
default-run = "taurhaus"

[features]
default = ["mesh-bridged-backend"]
mesh-bridged-backend = []

[lib]
name = "taurhaus_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "taurhaus-daemon"
path = "src/bin/taurhaus-daemon.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rusqlite = { version = "0.32", features = ["bundled"] }

git2 = { version = "0.19", features = ["vendored-openssl"] }
ignore = "0.4"

serde_norway = "0.9.42"

notify = "7"

tantivy = "0.22"
toml = "0.9.12"
dirs = "6.0.0"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ctrlc = "3"
socket2 = { version = "0.5", features = ["all"] }
fs2 = "0.4.3"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
