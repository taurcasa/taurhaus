title = "taurhaus gitleaks config"

[extend]
useDefault = true

# Research docs pin their evidence files by SHA-256 digest. The
# token-accounting digest trips generic-api-key ("Token-" wording next
# to 64 hex chars). These are file checksums, not credentials — each
# allowlisted digest is listed individually and reviewed.
[allowlist]
description = "SHA-256 file checksums quoted in committed research documents"
regexTarget = "line"
regexes = [
  # RFC 6455 sample WebSocket nonce ('the sample nonce'), a public spec constant recorded in native-eligibility evidence
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  '''5e4cdfc3ba40af04ed58d9c062dcb745be5eb0c06ea5734edf39747c8586de3e''',
  # Mesh delivery idempotency keys: per-attempt UUID request ids in journal and receipt evidence, not credentials
  '''idempotency_key":\s*"[0-9a-f-]{32,64}"''',
  # RFC 6455 client handshake nonce captured in native-eligibility host-event evidence: single-use, public on the wire
  '''Sec-WebSocket-Key: [A-Za-z0-9+/]{22}==''',
  # Mesh team config's controlAuthTokenHash: a truncated hash of a scratch team's per-team control token, captured in e2e evidence after the team was destroyed; the token itself is never recorded
  '''controlAuthTokenHash":\s*"[0-9a-f]{16,64}"''',
  # The recovery card names the assignment by its mesh assignment id ("Assignment: task=N token=<uuid>"): an identifier, never a credential
  '''Assignment: task=[0-9]+ token=[0-9a-f-]{36}''',
]
