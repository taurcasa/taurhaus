# Infographic generation manifest for taurhaus documentation.
# Initially generated by scripts/bootstrap-infographic-manifest.sh; maintained with the images.
# Full prompts stored here for self-sufficient regeneration.
#
# Regenerate with `just infographics` (copy .env.example to .env first): it sends
# the prompts below to the OpenAI Images API, writes the images, and updates each
# entry in place — recipe, checksum, date, history, and the stale markers.
# Workflow and flags: docs/operations/infographics.md
#
# Manual fallback, with any image tool:
#   1. Find the entry below by image id
#   2. Copy the prompt, make edits for new content
#   3. Regenerate with the available image tool (pass the current image as a style reference)
#   4. Optimize: ./scripts/optimize-doc-image.sh <output> docs/images/<name>.jpg
#   5. Update this entry's recipe, checksum, date, and history
#   6. If the entry carries `stale: true`, delete that key with `stale_since` and
#      `stale_reason` once the regenerated image matches the prompt
#
# `stale: true` means the prompt below is current but the .jpg on disk is not:
# the image still shows a superseded architecture and the pages that embed it say
# so. A non-null `sha256` describes the file on disk, stale or not; entries whose
# image predates the manifest carry `sha256: null` and are not checksummed.

