  mesh-resume-liveness-sequence:
    output_path: docs/images/mesh-resume-liveness-sequence.jpg
    status: active
    generation_id: gen_482a7ff491ee
    recipe:
      model: gemini-3-pro-image-preview
      aspect_ratio: "16:9"
      image_size: 2K
      reference_image_paths:
        - docs/images/mesh-view-lifecycle.jpg
      prompt: |
        Technical sequence diagram infographic titled "taurhaus — Resume + Liveness Reconciliation" with subtitle "End-to-end sequence for offline agent recovery and health drift detection".

        Dark teal gradient background. All boxes are teal/cyan with rounded corners and white text. Professional software architecture sequence diagram style.

        TWO SWIM LANES side by side:

        LEFT LANE: "Agent Resume Flow"
        Actors shown as column headers: "MeshTeamRoster (UI)" | "IPC command" | "CoordinationOrchestrator" | "tmux / runtime"

        Sequence:
        1. MeshTeamRoster: "User clicks Resume on offline agent"
        2. Arrow right: "Select context mode: Continue or Fresh"
        3. Arrow to IPC: "coordination_resume_member"
        4. Arrow to Orchestrator: "validate: must be offline"
        5. Arrow to Orchestrator: "resolve or create tmux pane"
        6. Arrow to tmux: "launch CLI (mode-aware flags)"
        7. Branch: "Continue → resume last session" / "Fresh → new session"
        8. Arrow to tmux: "join_mesh / start_daemon (non-Claude)"
        9. Arrow to tmux: "send onboarding (if applicable)"
        10. Arrow back to Orchestrator: "update runtime record → Active"
        11. Arrow back to UI: "roster refreshes"

        RIGHT LANE: "Liveness Reconciliation (write-on-drift)"
        Actors: "MeshTeamRoster (UI)" | "IPC command" | "CoordinationOrchestrator" | "tmux checks"

        Sequence:
        1. UI: "Periodic or on-demand status poll"
        2. Arrow to IPC: "coordination_get_live_team_status"
        3. Arrow to Orchestrator: "reconcile_team_liveness()"
        4. Arrow to tmux: "For each member:"
        5. Check: "pane_id missing? → SessionDead"
        6. Check: "pane doesn't exist? → SessionDead"
        7. Check: "pane is dead? → SessionDead"
        8. Check: "pane_is_shell (CLI exited)? → SessionDead"
        9. Arrow: "Non-Claude: cleanup daemon_pid"
        10. Arrow back: "Write corrected health to runtime store"
        11. Arrow back to UI: "roster shows updated health states"

        Bottom note: "Write-on-drift: health mutations happen during READ queries, not on a timer"

        NO photographs or portraits — text, boxes, arrows, and geometric shapes only. Clean infographic style matching dark teal software documentation aesthetics.
